<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="t d">
  <title id="t">logan jarrin</title>
  <desc id="d">An ASCII ocean drifting under a terminal panel that reads whoami, logan jarrin, I build software and small experiments.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; white-space: pre; }
    .drift-l { animation: left linear infinite; }
    .drift-r { animation: right linear infinite; }
    @keyframes left { from { transform: translateX(0); } to { transform: translateX(-880px); } }
    @keyframes right { from { transform: translateX(-880px); } to { transform: translateX(0); } }
    .fin { animation: swim 26s linear infinite; }
    @keyframes swim { from { transform: translateX(-60px); } to { transform: translateX(940px); } }
    .fin2 { animation: swim2 34s linear infinite; animation-delay: -14s; }
    @keyframes swim2 { from { transform: translateX(940px); } to { transform: translateX(-60px); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .drift-l, .drift-r, .fin, .fin2, .cursor { animation: none; } }
  </style>
